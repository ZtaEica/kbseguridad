<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KB Seguridad | Panamá</title>
<meta name="description" content="Seguridad privada, monitoreo 24/7 y sistemas electrónicos en Panamá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#faf9f6">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#"><i data-lucide="shield-check"></i><span id="brand">KB</span></a>
  <nav id="menu">
    <a href="#servicios">Servicios</a><a href="#nosotros">Nosotros</a><a href="#blog">Blog</a><a href="#contacto">Contacto</a>
  </nav>
  <a class="btn" id="cta" href="#cotizacion" aria-label="Solicitar cotización"><i data-lucide="clipboard-list"></i><span>Cotizar</span></a>
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Tema oscuro" aria-pressed="false" title="Cambiar al tema oscuro">
    <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
    <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <span class="theme-label" aria-hidden="true">Oscuro</span>
  </button>
  <button id="burger" aria-label="Menú"><i data-lucide="menu"></i></button>
</header>
<main id="app"></main>
<footer id="ft"></footer>
<dialog id="dg" aria-labelledby="article-title"></dialog>
<dialog id="service-dialog" aria-labelledby="service-title"></dialog>
<button class="btn" id="cb" aria-label="Abrir chat"><i data-lucide="message-square-text"></i></button>
<div id="cw">
  <div class="ch">Asistente virtual</div>
  <div id="ms"></div>
  <div class="q" id="qk"></div>
  <form class="cf" id="cf"><input id="ci" placeholder="Escribe tu duda…" autocomplete="off"><button class="btn" style="padding:10px 14px" aria-label="Enviar"><i data-lucide="send"></i></button></form>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="/demo.js"></script>
<script src="/app.js"></script>
</body>
</html>
