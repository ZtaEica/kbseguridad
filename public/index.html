<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KB Seguridad | Panamá</title>
<meta name="description" content="Seguridad privada, monitoreo 24/7 y sistemas electrónicos en Panamá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.kbTheme||"light"</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#"><i data-lucide="shield-check"></i><span id="brand">KB</span></a>
  <nav id="menu">
    <a href="#servicios">Servicios</a><a href="#nosotros">Nosotros</a><a href="#blog">Blog</a><a href="#cotizar">Cotizar</a><a href="#contacto">Contacto</a>
  </nav>
  <a class="btn" id="cta" target="_blank" rel="noopener"><i data-lucide="message-circle"></i><span>Cotizar</span></a>
  <button id="tg" aria-label="Cambiar tema"><i data-lucide="moon"></i></button>
  <button id="burger" aria-label="Menú"><i data-lucide="menu"></i></button>
</header>
<main id="app"></main>
<footer id="ft"></footer>
<dialog id="dg"></dialog>
<button class="btn" id="cb" aria-label="Abrir chat"><i data-lucide="message-square-text"></i></button>
<div id="cw">
  <div class="ch">Asistente virtual</div>
  <div id="ms"></div>
  <div class="q" id="qk"></div>
  <form class="cf" id="cf"><input id="ci" placeholder="Escribe tu duda…" autocomplete="off"><button class="btn" style="padding:10px 14px" aria-label="Enviar"><i data-lucide="send"></i></button></form>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
